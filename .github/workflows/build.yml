
name: Build APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v6

      - name: Установка Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Создание Firebase заглушки
        run: cp app/google-services.json.example app/google-services.json

      - name: Выдача прав на запуск Gradle
        run: chmod +x ./gradlew

      - name: Сборка Debug APK без Firebase
        run: FIREBASE_ENABLED=false ./gradlew assembleFullDebug

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-assistant-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
